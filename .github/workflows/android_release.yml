name: "Build and Release APK"

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  export-android:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # El runner de GitHub (ubuntu-latest) ya trae el Android SDK preinstalado
      # en $ANDROID_SDK_ROOT. Usamos ese SDK directamente en lugar de
      # android-actions/setup-android, que falla al aceptar licencias.
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # Aceptar licencias (yes alimenta todos los prompts; no abortar si ya estaban aceptadas)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          # Asegurar los componentes que Godot necesita para firmar/empaquetar el APK
          "$SDKMANAGER" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Godot 4.6
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip Godot_v4.6-stable_linux.x86_64.zip
          mv Godot_v4.6-stable_linux.x86_64 godot.exec
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          wget https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          unzip Godot_v4.6-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.6.stable
          mv ~/.local/share/godot/export_templates/4.6.stable/templates/* ~/.local/share/godot/export_templates/4.6.stable/

      # Godot 4.6 busca por defecto el keystore de debug en
      # ~/.local/share/godot/keystores/debug.keystore, con usuario
      # "androiddebugkey" y password "android". Lo generamos en esa misma ruta
      # para no depender de editar los editor settings a mano (un .tres escrito
      # manualmente puede no cargar y provoca "configuration errors" sin detalle).
      - name: Generate Android debug keystore (ruta por defecto de Godot)
        run: |
          KS_DIR="$HOME/.local/share/godot/keystores"
          mkdir -p "$KS_DIR"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$KS_DIR/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      - name: Create Export Directory
        run: mkdir -p export

      # Importamos los recursos en un proceso aparte ANTES de exportar. Esto:
      #  - evita que el export tenga que reimportar (errores "Unable to open .ctex"),
      #  - hace que Godot autodetecte y PERSISTA en editor_settings-4.6.tres las
      #    rutas del SDK ($ANDROID_HOME) y del JDK ($JAVA_HOME), ademas del
      #    keystore de debug por defecto generado en el paso anterior.
      # El import puede devolver codigo != 0 al no poder guardar algunos ajustes
      # en el runner; es inofensivo, por eso "|| true".
      - name: Import Project Resources
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          ./godot.exec --headless --path . --import || true

      # Diagnostico: dejar constancia de la config que Godot autodetecto, util si
      # el export vuelve a fallar.
      - name: Show detected editor settings
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "--- editor_settings-4.6.tres (claves android/java) ---"
          grep -iE "android_sdk_path|java_sdk_path|debug_keystore" \
            ~/.config/godot/editor_settings-4.6.tres || echo "(sin claves android/java)"

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          # Firmamos el release con el keystore de debug generado antes. Sin estas
          # variables, --export-release produce un APK SIN firmar (apksigner:
          # "Missing META-INF/MANIFEST.MF") que no se puede instalar.
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          # $HOME es la variable del runner (la de las expresiones ${{ env.HOME }}
          # no existe), por eso construimos la ruta aqui en el shell.
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/.local/share/godot/keystores/debug.keystore"
          # --export-release "Android" fuerza a Godot a usar el preset de Android.
          # El preset exige compresion de texturas ETC2/ASTC (habilitada en
          # project.godot con rendering/textures/vram_compression/import_etc2_astc);
          # sin ella Godot marca "configuration errors" SIN detalle en headless.
          ./godot.exec --headless --path . --export-release "Android" export/RED_Mission_Trainer.apk

      - name: Verify APK exists and is signed
        run: |
          ls -lh export/RED_Mission_Trainer.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose export/RED_Mission_Trainer.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: "RED Mission Trainer - Build ${{ github.run_number }}"
          files: export/RED_Mission_Trainer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
